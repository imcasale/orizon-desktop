<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orizon</title>
<style>/*orizon-rosso*/
  /* Orizon: pagina di benvenuto per computer (app desktop e web), essenziale come Telegram Desktop */
  :root {
    --bg: #FFFFFF;
    --text: #14121F;
    --text-2: #6B6979;
    --accent: #8B1A2B;
    --accent-2: #A0263A;
    --line: rgba(20, 18, 31, .12);
    --hover: rgba(20, 18, 31, .06);
    --menu: rgba(255, 255, 255, .97);
    --shadow: 0 16px 40px rgba(20, 18, 31, .14), 0 2px 8px rgba(20, 18, 31, .06);
  }
  body.dark {
    --bg: #0E0E12;
    --text: #F2F1F7;
    --text-2: #9C9AAE;
    --accent: #EE2229;
    --accent-2: #F0383E;
    --line: rgba(255, 255, 255, .14);
    --hover: rgba(255, 255, 255, .08);
    --menu: rgba(26, 26, 32, .97);
    --shadow: 0 16px 40px rgba(0, 0, 0, .5), 0 2px 8px rgba(0, 0, 0, .3);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: Inter, "Space Grotesk", -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: var(--bg); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; transition: background .25s, color .25s;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* tema, in alto a destra */
  .theme { position: fixed; top: 16px; right: 16px; width: 40px; height: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--text-2); transition: background .18s, color .18s; }
  .theme:hover { background: var(--hover); color: var(--text); }
  .theme svg { width: 19px; height: 19px; }

  /* i due passi: benvenuto e scelta */
  .stage { position: relative; width: 100%; max-width: 420px; height: 440px; }
  .step {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    transition: opacity .32s ease, transform .32s ease;
  }
  .step[hidden] { display: flex; opacity: 0; transform: translateX(-24px); pointer-events: none; visibility: hidden; transition: opacity .32s ease, transform .32s ease, visibility 0s .32s; }
  #step2[hidden] { transform: translateX(24px); }

  .icon { display: block; border-radius: 26%; box-shadow: 0 10px 28px rgba(0, 0, 0, .16); }
  #step1 .icon { width: 132px; height: 132px; }
  #step2 .icon { width: 76px; height: 76px; }
  h1 { margin-top: 26px; font-size: 26px; font-weight: 700; letter-spacing: -.4px; }
  h2 { margin-top: 20px; font-size: 22px; font-weight: 700; letter-spacing: -.3px; min-height: 28px; }
  .sub { margin-top: 10px; font-size: 15px; line-height: 1.55; color: var(--text-2); max-width: 340px; min-height: 46px; }

  .btn { display: flex; align-items: center; justify-content: center; width: 280px; height: 48px; border-radius: 999px; font-size: 15px; font-weight: 600; letter-spacing: .1px; text-decoration: none; transition: background .18s, transform .12s, border-color .18s; }
  .btn:active { transform: scale(.98); }
  .primary { background: var(--accent); color: #fff; }
  .primary:hover { background: var(--accent-2); }
  .secondary { color: var(--accent); border: 1.5px solid var(--line); }
  .secondary:hover { border-color: var(--accent); }
  #step1 .btn { margin-top: 34px; }
  #step2 .primary { margin-top: 28px; }
  #step2 .secondary { margin-top: 10px; }

  .link { margin-top: 18px; height: 34px; padding: 0 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: var(--accent); transition: background .18s; }
  .link:hover { background: var(--hover); }
  .link svg { width: 15px; height: 15px; }
  .back { color: var(--text-2); }
  .back:hover { color: var(--text); }

  /* menu delle lingue */
  .lang-wrap { position: relative; }
  .lang-menu {
    position: absolute; bottom: calc(100% + 8px); left: 50%; width: 230px; max-height: min(340px, 60vh); overflow-y: auto;
    padding: 6px; border-radius: 20px; border: 1px solid var(--line); background: var(--menu); box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6);
    opacity: 0; transform: translate(-50%, 6px) scale(.98); transform-origin: bottom center; pointer-events: none; transition: opacity .18s, transform .18s;
  }
  .lang-menu.open { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .lang-menu button { display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 12px; border-radius: 999px; font-size: 14px; text-align: left; transition: background .15s; }
  .lang-menu button:hover { background: var(--hover); }
  .lang-menu .code { width: 24px; font-size: 11px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; opacity: .55; }
  .lang-menu button[aria-selected="true"] { background: var(--accent); color: #fff; font-weight: 600; }
  .lang-menu button[aria-selected="true"] .code { opacity: .8; }
  .lang-menu::-webkit-scrollbar { width: 0; }

  .dom { position: fixed; bottom: 18px; left: 0; right: 0; text-align: center; font-size: 12px; }
  .dom a { color: var(--text-2); text-decoration: none; opacity: .8; }
  .dom a:hover { opacity: 1; }

  @media (max-height: 560px) {
    #step1 .icon { width: 96px; height: 96px; }
    h1 { margin-top: 18px; }
    #step1 .btn { margin-top: 24px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <button class="theme" id="theme" aria-label="Tema"></button>

  <main class="stage">
    <section class="step" id="step1">
      <img class="icon" src="../../vector-icons/512.png" onerror="this.onerror=null;this.src='/vector-icons/512.png'" alt="" width="132" height="132">
      <h1>Orizon</h1>
      <p class="sub"><span id="tag1"></span><br><span id="tag2"></span></p>
      <button class="btn primary" id="start"></button>
      <div class="lang-wrap">
        <button class="link" id="langBtn" aria-haspopup="listbox" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/></svg>
          <span id="langLabel"></span>
        </button>
        <div class="lang-menu" id="langMenu" role="listbox"></div>
      </div>
    </section>

    <section class="step" id="step2" hidden>
      <img class="icon" src="../../vector-icons/512.png" onerror="this.onerror=null;this.src='/vector-icons/512.png'" alt="" width="76" height="76">
      <h2 id="title"></h2>
      <p class="sub" id="sub"></p>
      <a href="#/login" class="btn primary mx_ButtonSignIn" id="login"></a>
      <a href="#/register" class="btn secondary mx_ButtonCreateAccount" id="register"></a>
      <button class="link back" id="back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        <span id="backLabel"></span>
      </button>
    </section>
  </main>

  <div class="dom"><a href="https://4orizon.eu" target="_blank" rel="noopener">4orizon.eu</a></div>

<script>
var L = {
  it:{n:"Italiano",t1:"Messaggistica cifrata end-to-end.",t2:"Le tue conversazioni restano tue.",w:"Benvenuto",s:"Accedi al tuo account o creane uno nuovo.",i:"Accedi",r:"Registrati"},
  en:{n:"English",t1:"End-to-end encrypted messaging.",t2:"Your conversations stay yours.",w:"Welcome",s:"Sign in to your account or create a new one.",i:"Sign in",r:"Register"},
  de:{n:"Deutsch",t1:"Ende-zu-Ende-verschlüsselte Nachrichten.",t2:"Deine Gespräche bleiben deine.",w:"Willkommen",s:"Melde dich an oder erstelle ein neues Konto.",i:"Anmelden",r:"Registrieren"},
  fr:{n:"Français",t1:"Messagerie chiffrée de bout en bout.",t2:"Vos conversations restent les vôtres.",w:"Bienvenue",s:"Connectez-vous à votre compte ou créez-en un.",i:"Se connecter",r:"S'inscrire"},
  es:{n:"Español",t1:"Mensajería cifrada de extremo a extremo.",t2:"Tus conversaciones siguen siendo tuyas.",w:"Bienvenido",s:"Inicia sesión o crea una cuenta nueva.",i:"Iniciar sesión",r:"Registrarse"},
  pt:{n:"Português",t1:"Mensagens cifradas ponta a ponta.",t2:"As tuas conversas continuam tuas.",w:"Bem-vindo",s:"Inicia sessão ou cria uma conta nova.",i:"Iniciar sessão",r:"Registar"},
  nl:{n:"Nederlands",t1:"End-to-end versleutelde berichten.",t2:"Je gesprekken blijven van jou.",w:"Welkom",s:"Log in of maak een nieuw account aan.",i:"Inloggen",r:"Registreren"},
  pl:{n:"Polski",t1:"Wiadomości szyfrowane end-to-end.",t2:"Twoje rozmowy pozostają twoje.",w:"Witaj",s:"Zaloguj się lub załóż nowe konto.",i:"Zaloguj się",r:"Zarejestruj się"},
  sv:{n:"Svenska",t1:"Totalsträckskrypterade meddelanden.",t2:"Dina samtal förblir dina.",w:"Välkommen",s:"Logga in eller skapa ett nytt konto.",i:"Logga in",r:"Registrera dig"},
  da:{n:"Dansk",t1:"End-to-end-krypterede beskeder.",t2:"Dine samtaler forbliver dine.",w:"Velkommen",s:"Log ind, eller opret en ny konto.",i:"Log ind",r:"Opret konto"},
  fi:{n:"Suomi",t1:"Päästä päähän salatut viestit.",t2:"Keskustelusi pysyvät sinun.",w:"Tervetuloa",s:"Kirjaudu sisään tai luo uusi tili.",i:"Kirjaudu sisään",r:"Rekisteröidy"},
  cs:{n:"Čeština",t1:"Zprávy šifrované end-to-end.",t2:"Vaše konverzace zůstávají vaše.",w:"Vítejte",s:"Přihlaste se nebo si vytvořte nový účet.",i:"Přihlásit se",r:"Registrovat se"},
  sk:{n:"Slovenčina",t1:"Správy šifrované end-to-end.",t2:"Vaše konverzácie zostávajú vaše.",w:"Vitajte",s:"Prihláste sa alebo si vytvorte nový účet.",i:"Prihlásiť sa",r:"Registrovať sa"},
  hu:{n:"Magyar",t1:"Végpontok közti titkosított üzenetküldés.",t2:"A beszélgetéseid a tieid maradnak.",w:"Üdvözlünk",s:"Jelentkezz be, vagy hozz létre új fiókot.",i:"Bejelentkezés",r:"Regisztráció"},
  ro:{n:"Română",t1:"Mesagerie criptată end-to-end.",t2:"Conversațiile tale rămân ale tale.",w:"Bun venit",s:"Conectează-te sau creează un cont nou.",i:"Conectare",r:"Înregistrare"},
  bg:{n:"Български",t1:"Съобщения с криптиране от край до край.",t2:"Разговорите ви остават ваши.",w:"Добре дошли",s:"Влезте в профила си или създайте нов.",i:"Вход",r:"Регистрация"},
  el:{n:"Ελληνικά",t1:"Μηνύματα με κρυπτογράφηση από άκρο σε άκρο.",t2:"Οι συνομιλίες σας παραμένουν δικές σας.",w:"Καλώς ήρθατε",s:"Συνδεθείτε ή δημιουργήστε νέο λογαριασμό.",i:"Σύνδεση",r:"Εγγραφή"},
  hr:{n:"Hrvatski",t1:"Poruke šifrirane s kraja na kraj.",t2:"Vaši razgovori ostaju vaši.",w:"Dobro došli",s:"Prijavite se ili otvorite novi račun.",i:"Prijava",r:"Registracija"},
  sl:{n:"Slovenščina",t1:"Sporočila s šifriranjem od konca do konca.",t2:"Vaši pogovori ostanejo vaši.",w:"Dobrodošli",s:"Prijavite se ali ustvarite nov račun.",i:"Prijava",r:"Registracija"},
  et:{n:"Eesti",t1:"Läbiva krüpteeringuga sõnumid.",t2:"Sinu vestlused jäävad sinu omaks.",w:"Tere tulemast",s:"Logi sisse või loo uus konto.",i:"Logi sisse",r:"Registreeru"},
  lv:{n:"Latviešu",t1:"Pilnībā šifrēta ziņapmaiņa.",t2:"Tavas sarunas paliek tavas.",w:"Laipni lūdzam",s:"Piesakies vai izveido jaunu kontu.",i:"Pieteikties",r:"Reģistrēties"},
  lt:{n:"Lietuvių",t1:"Ištisai šifruoti pranešimai.",t2:"Tavo pokalbiai lieka tavo.",w:"Sveiki",s:"Prisijunk arba sukurk naują paskyrą.",i:"Prisijungti",r:"Registruotis"},
  uk:{n:"Українська",t1:"Наскрізно зашифровані повідомлення.",t2:"Ваші розмови залишаються вашими.",w:"Вітаємо",s:"Увійдіть в обліковий запис або створіть новий.",i:"Увійти",r:"Зареєструватися"}
};
var EXTRA = {
  it:["Inizia","Indietro"], en:["Get started","Back"], de:["Los geht's","Zurück"], fr:["Commencer","Retour"],
  es:["Empezar","Atrás"], pt:["Começar","Voltar"], nl:["Aan de slag","Terug"], pl:["Rozpocznij","Wstecz"],
  sv:["Kom igång","Tillbaka"], da:["Kom i gang","Tilbage"], fi:["Aloita","Takaisin"], cs:["Začít","Zpět"],
  sk:["Začať","Späť"], hu:["Kezdés","Vissza"], ro:["Începe","Înapoi"], bg:["Започни","Назад"],
  el:["Ξεκινήστε","Πίσω"], hr:["Započni","Natrag"], sl:["Začni","Nazaj"], et:["Alusta","Tagasi"],
  lv:["Sākt","Atpakaļ"], lt:["Pradėti","Atgal"], uk:["Почати","Назад"]
};
Object.keys(L).forEach(function (k) { L[k].go = (EXTRA[k] || EXTRA.en)[0]; L[k].bk = (EXTRA[k] || EXTRA.en)[1]; });

var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.1M12 19.5v2.1M4.2 4.2l1.5 1.5M18.3 18.3l1.5 1.5M2.4 12h2.1M19.5 12h2.1M4.2 19.8l1.5-1.5M18.3 5.7l1.5-1.5"/></svg>';
var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"/></svg>';

function store(k, v) {
  try {
    if (v === undefined) return localStorage.getItem(k);
    localStorage.setItem(k, v);
  } catch (e) { return null; }
}
function $(id) { return document.getElementById(id); }

/* La lingua scelta qui diventa anche la lingua di Orizon (Element la tiene in mx_local_settings).
   Element la applica quando si ricarica: lo facciamo quando si preme Accedi o Registrati. */
var top_ = (function () { try { return window.top.document ? window.top : window; } catch (e) { return window; } })();
function elementLang() {
  try { var s = JSON.parse(localStorage.getItem('mx_local_settings') || '{}'); return s.language || ''; } catch (e) { return ''; }
}
function setElementLang(code) {
  try {
    var s = JSON.parse(localStorage.getItem('mx_local_settings') || '{}');
    s.language = code;
    localStorage.setItem('mx_local_settings', JSON.stringify(s));
  } catch (e) {}
}
var running = (top_.document.documentElement.lang || '').toLowerCase();  /* lingua con cui Orizon è partito */
var available = null;  /* lingue che Orizon ha davvero */
try {
  fetch(new URL('i18n/languages.json', top_.location.href).href).then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) { if (j) available = j; }).catch(function () {});
} catch (e) {}

var lang = (elementLang() || store('orizon.lang') || navigator.language || 'it').slice(0, 2).toLowerCase();
if (!L[lang]) lang = 'en';

function closeMenu() { $('langMenu').classList.remove('open'); $('langBtn').setAttribute('aria-expanded', 'false'); }

/* testo che si ricompone quando cambi lingua, come sul sito */
var GLYPHS = '!<>-_\\/[]{}=+*^?#$%&@~;:';
var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function scramble(el, text, dur) {
  if (el._raf) cancelAnimationFrame(el._raf);
  if (reduced) { el.textContent = text; return; }
  var chars = Array.from(text);
  var plan = chars.map(function () {
    return { to: dur * 0.45 + Math.random() * dur * 0.55, glyph: GLYPHS[(Math.random() * GLYPHS.length) | 0], next: Math.random() * 110 };
  });
  var start = performance.now();
  function frame(now) {
    var t = now - start, out = '', done = 0;
    for (var i = 0; i < chars.length; i++) {
      if (chars[i] === ' ') { out += ' '; done++; continue; }
      if (t >= plan[i].to) { out += chars[i]; done++; continue; }
      if (t >= plan[i].next) { plan[i].glyph = GLYPHS[(Math.random() * GLYPHS.length) | 0]; plan[i].next = t + 110 * (0.7 + Math.random() * 0.6); }
      out += plan[i].glyph;
    }
    el.textContent = out;
    if (done < chars.length) el._raf = requestAnimationFrame(frame);
    else { el.textContent = text; el._raf = null; }
  }
  el._raf = requestAnimationFrame(frame);
}
function put(id, text, animate) {
  if (animate) scramble($(id), text, 1100);
  else $(id).textContent = text;
}

function render(animate) {
  var d = L[lang];
  document.documentElement.lang = lang;
  put('tag1', d.t1, animate);
  put('tag2', d.t2, animate);
  put('start', d.go, animate);
  put('langLabel', d.n, animate);
  put('title', d.w, animate);
  put('sub', d.s, animate);
  put('login', d.i, animate);
  put('register', d.r, animate);
  put('backLabel', d.bk, animate);
  var m = $('langMenu');
  m.innerHTML = '';
  Object.keys(L).sort(function (a, b) { return L[a].n.localeCompare(L[b].n); }).forEach(function (k) {
    var b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('role', 'option');
    b.setAttribute('aria-selected', k === lang ? 'true' : 'false');
    b.innerHTML = '<span class="code">' + k + '</span><span class="nm"></span>';
    b.querySelector('.nm').textContent = L[k].n;
    b.onclick = function () {
      closeMenu();
      if (k === lang) return;
      lang = k;
      store('orizon.lang', k);
      if (!available || available[k]) setElementLang(k);
      render(true);
    };
    m.appendChild(b);
  });
}

$('langBtn').onclick = function (e) {
  e.stopPropagation();
  var open = $('langMenu').classList.toggle('open');
  this.setAttribute('aria-expanded', open ? 'true' : 'false');
  if (open) { var sel = $('langMenu').querySelector('[aria-selected="true"]'); if (sel) $('langMenu').scrollTop = Math.max(0, sel.offsetTop - 120); }
};
$('langMenu').onclick = function (e) { e.stopPropagation(); };
document.addEventListener('click', closeMenu);
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { closeMenu(); if (!$('step2').hidden) show(1); }
});

function show(n) {
  $('step1').hidden = n !== 1;
  $('step2').hidden = n !== 2;
  (n === 1 ? $('start') : $('login')).focus({ preventScroll: true });
}
$('start').onclick = function () { show(2); };
$('back').onclick = function () { show(1); };

function applyTheme(dark) {
  document.body.classList.toggle('dark', dark);
  $('theme').innerHTML = dark ? SUN : MOON;
  store('orizon.theme', dark ? 'dark' : 'light');
}
var saved = store('orizon.theme');
applyTheme(saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches);
$('theme').onclick = function () { applyTheme(!document.body.classList.contains('dark')); };

render(false);

document.querySelectorAll('a[href^="#/"]').forEach(function (a) {
  a.addEventListener('click', function (e) {
    e.preventDefault();
    var w = window.top !== window ? window.top : window;
    w.location.hash = a.getAttribute('href').slice(1);
    /* se è cambiata la lingua, Orizon riparte già nella lingua nuova */
    var want = elementLang().toLowerCase();
    if (want && running && want !== running) w.location.reload();
  });
});
</script>
</body>
</html>
