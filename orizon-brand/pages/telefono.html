<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B8141C">
<title>Orizon</title>
<link rel="icon" href="/vector-icons/180.png">
<link rel="apple-touch-icon" href="/vector-icons/180.png">
<style>
  /* Orizon dal telefono: app Android (test), iPhone (in arrivo) oppure il browser. Stesso stile del benvenuto. */
  :root {
    --bg: #FFFFFF;
    --card: #F5F5F7;
    --text: #14121F;
    --text-2: #6B6979;
    --accent: #8B1A2B;
    --accent-2: #A0263A;
    --accent-soft: rgba(139, 26, 43, .09);
    --line: rgba(20, 18, 31, .12);
    --hover: rgba(20, 18, 31, .06);
    --menu: rgba(255, 255, 255, .97);
    --shadow: 0 16px 40px rgba(20, 18, 31, .14), 0 2px 8px rgba(20, 18, 31, .06);
  }
  body.dark {
    --bg: #0E0E12;
    --card: #18181E;
    --text: #F2F1F7;
    --text-2: #9C9AAE;
    --accent: #EE2229;
    --accent-2: #F0383E;
    --accent-soft: rgba(238, 34, 41, .14);
    --line: rgba(255, 255, 255, .14);
    --hover: rgba(255, 255, 255, .08);
    --menu: rgba(26, 26, 32, .97);
    --shadow: 0 16px 40px rgba(0, 0, 0, .5), 0 2px 8px rgba(0, 0, 0, .3);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh;
    font-family: Inter, "Space Grotesk", -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: var(--bg); color: var(--text);
    transition: background .25s, color .25s;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* barra in alto: lingua a sinistra, tema a destra */
  .top { display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 0; }
  .round { height: 40px; min-width: 40px; padding: 0 12px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; color: var(--text-2); font-size: 14px; font-weight: 500; transition: background .18s, color .18s; }
  .round:hover, .round:active { background: var(--hover); color: var(--text); }
  .round svg { width: 19px; height: 19px; flex: none; }
  #theme { padding: 0; width: 40px; }

  main { flex: 1; width: 100%; max-width: 440px; margin: 0 auto; padding: 18px 20px 28px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .icon { display: block; width: 96px; height: 96px; border-radius: 26%; box-shadow: 0 10px 28px rgba(0, 0, 0, .16); }
  h1 { margin-top: 18px; font-size: 26px; font-weight: 700; letter-spacing: -.4px; }
  .sub { margin-top: 8px; font-size: 15px; line-height: 1.5; color: var(--text-2); min-height: 22px; }

  /* le schede: Android e iPhone (quella del tuo telefono va per prima) */
  .cards { width: 100%; margin-top: 26px; display: flex; flex-direction: column; gap: 12px; text-align: left; }
  .card { width: 100%; padding: 16px; border-radius: 24px; background: var(--card); }
  .card.mine { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .row { display: flex; align-items: center; gap: 14px; }
  .ic { width: 46px; height: 46px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent); }
  .ic svg { width: 24px; height: 24px; }
  .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .tx b { font-size: 16px; font-weight: 650; }
  .tx span { font-size: 14px; color: var(--text-2); }
  .chip { flex: none; height: 26px; padding: 0 10px; border-radius: 999px; display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; background: var(--accent); color: #fff; white-space: nowrap; }
  .chip[hidden] { display: none; }
  .soon { background: var(--hover); color: var(--text-2); }

  .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 50px; border-radius: 999px; font-size: 15px; font-weight: 600; letter-spacing: .1px; text-decoration: none; transition: background .18s, transform .12s, border-color .18s; }
  .btn:active { transform: scale(.98); }
  .primary { background: var(--accent); color: #fff; }
  .primary:hover { background: var(--accent-2); }
  .secondary { color: var(--accent); border: 1.5px solid var(--line); }
  .secondary:hover { border-color: var(--accent); }
  .card .btn { margin-top: 14px; }

  .web { width: 100%; margin-top: 22px; }
  .note { margin-top: 10px; font-size: 13px; line-height: 1.45; color: var(--text-2); max-width: 320px; min-height: 19px; }

  .link { margin-top: 14px; height: 36px; padding: 0 14px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: var(--accent); text-decoration: none; transition: background .18s; }
  .link:hover, .link:active { background: var(--hover); }
  .link svg { width: 15px; height: 15px; }

  .dom { padding: 6px 0 18px; text-align: center; font-size: 12px; }
  .dom a { color: var(--text-2); text-decoration: none; opacity: .8; }

  /* lingue: un foglio che sale dal basso */
  .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 5; }
  .sheet {
    position: fixed; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); max-width: 440px; margin: 0 auto; max-height: min(460px, 70vh); overflow-y: auto;
    padding: 8px; border-radius: 26px; border: 1px solid var(--line); background: var(--menu); box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(24px) saturate(1.6); backdrop-filter: blur(24px) saturate(1.6);
    transform: translateY(calc(100% + 24px)); transition: transform .28s cubic-bezier(.3, .7, .2, 1); z-index: 6;
  }
  .open .scrim { opacity: 1; pointer-events: auto; }
  .open .sheet { transform: none; }
  .sheet button { display: flex; align-items: center; gap: 12px; width: 100%; height: 46px; padding: 0 14px; border-radius: 999px; font-size: 15px; text-align: left; }
  .sheet button:active { background: var(--hover); }
  .sheet .code { width: 26px; font-size: 11px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; opacity: .55; }
  .sheet button[aria-selected="true"] { background: var(--accent); color: #fff; font-weight: 600; }
  .sheet button[aria-selected="true"] .code { opacity: .8; }
  .sheet::-webkit-scrollbar { width: 0; }

  @media (min-height: 760px) { main { justify-content: center; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

function $(id) { return document.getElementById(id); }
function store(k, v) {
  try {
    if (v === undefined) return localStorage.getItem(k);
    localStorage.setItem(k, v);
  } catch (e) { return null; }
}

  try { var s = JSON.parse(localStorage.getItem('mx_local_settings') || '{}'); return s.language || ''; } catch (e) { return ''; }
}
function setElementLang(code) {
  try {
    var s = JSON.parse(localStorage.getItem('mx_local_settings') || '{}');
    s.language = code;
    localStorage.setItem('mx_local_settings', JSON.stringify(s));
  } catch (e) {}
}

  if (reduced) { el.textContent = text; return; }
  var chars = Array.from(text);
  var plan = chars.map(function () { return { to: dur * 0.45 + Math.random() * dur * 0.55, glyph: GLYPHS[(Math.random() * GLYPHS.length) | 0], next: Math.random() * 110 }; });
  var start = performance.now();
  function frame(now) {
    var tt = now - start, out = '', done = 0;
    for (var i = 0; i < chars.length; i++) {
      if (chars[i] === ' ') { out += ' '; done++; continue; }
      if (tt >= plan[i].to) { out += chars[i]; done++; continue; }
      if (tt >= plan[i].next) { plan[i].glyph = GLYPHS[(Math.random() * GLYPHS.length) | 0]; plan[i].next = tt + 110 * (0.7 + Math.random() * 0.6); }
      out += plan[i].glyph;
    }
    el.textContent = out;
    if (done < chars.length) el._raf = requestAnimationFrame(frame);
    else { el.textContent = text; el._raf = null; }
  }
  el._raf = requestAnimationFrame(frame);
}
function put(id, text, animate) { if (animate) scramble($(id), text, 1000); else $(id).textContent = text; }

function render(animate) {
  document.documentElement.lang = lang;
  ['tag', 'and', 'andS', 'andB', 'ios', 'iosS', 'web', 'webS', 'all'].forEach(function (k) { put(k, t(k), animate); });
  put('langLabel', L[lang][0], animate);
  ['mineAndroid', 'mineIphone'].forEach(function (id) {
    var on = (id === 'mineAndroid' && device === 'android') || (id === 'mineIphone' && device === 'iphone');
    $(id).hidden = !on;
    if (on) put(id, t('mine'), animate);
  });
  $('andB').href = 'mailto:info@4orizon.eu?subject=' + encodeURIComponent(t('subj')) + '&body=' + encodeURIComponent(t('body'));
  var m = $('sheet');
  m.innerHTML = '';
  Object.keys(L).sort(function (a, b) { return L[a][0].localeCompare(L[b][0]); }).forEach(function (k) {
    var b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('role', 'option');
    b.setAttribute('aria-selected', k === lang ? 'true' : 'false');
    b.innerHTML = '<span class="code">' + k + '</span><span class="nm"></span>';
    b.querySelector('.nm').textContent = L[k][0];
    b.onclick = function () {
      closeSheet();
      if (k === lang) return;
      lang = k;
      store('orizon.lang', k);
      setElementLang(k);
      render(true);
    };
    m.appendChild(b);
  });
}

function openSheet() {
  document.body.classList.add('open');
  $('langBtn').setAttribute('aria-expanded', 'true');
  var sel = $('sheet').querySelector('[aria-selected="true"]');
  if (sel) $('sheet').scrollTop = Math.max(0, sel.offsetTop - 140);
}
function closeSheet() { document.body.classList.remove('open'); $('langBtn').setAttribute('aria-expanded', 'false'); }
$('langBtn').onclick = openSheet;
$('scrim').onclick = closeSheet;
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

/* "Continua nel browser": Orizon web, e su questo telefono la pagina non torna più */
$('web').onclick = function () {
  store('orizon.browser', '1');
  try { sessionStorage.setItem('orizon.browser', '1'); sessionStorage.setItem('skip_mobile_redirect', 'true'); } catch (e) {}
  location.replace('/' + location.hash);
};

/* tema: lo stesso del benvenuto */
var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.1M12 19.5v2.1M4.2 4.2l1.5 1.5M18.3 18.3l1.5 1.5M2.4 12h2.1M19.5 12h2.1M4.2 19.8l1.5-1.5M18.3 5.7l1.5-1.5"/></svg>';
var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"/></svg>';
function applyTheme(dark) {
  document.body.classList.toggle('dark', dark);
  $('theme').innerHTML = dark ? SUN : MOON;
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = dark ? '#0E0E12' : '#FFFFFF';
}
var saved = store('orizon.theme');
applyTheme(saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches);
$('theme').onclick = function () {
  var dark = !document.body.classList.contains('dark');
  applyTheme(dark);
  store('orizon.theme', dark ? 'dark' : 'light');
};

render(false);
</script>
